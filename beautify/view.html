<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 뷰어 미리보기 | DevWorKit</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
        }

        #render-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 플로팅 툴바 드래그 중 iframe이 마우스 포인터를 뺏어가지 못하도록 방어 */
        body.is-dragging-toolbar #render-frame {
            pointer-events: none !important;
        }

        .viewer-floating-bar {
            position: fixed;
            top: 26px;
            right: 20px;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            padding: 4px 8px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            user-select: none;
            touch-action: none;
        }

        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 7px 6px 5px;
            color: #94a3b8;
            cursor: grab;
            font-size: 13px;
            letter-spacing: 1px;
            line-height: 1;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            margin-right: 2px;
            transition: color 0.15s;
        }

        .drag-handle:hover {
            color: #38bdf8;
        }

        .viewer-floating-bar.dragging {
            cursor: grabbing !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
        }

        .viewer-btn {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 11px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .viewer-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #38bdf8;
        }

        .source-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            z-index: 2147483647;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .source-modal-overlay.active {
            display: flex;
        }

        .source-modal-card {
            background: #ffffff;
            width: 960px;
            max-width: 100%;
            height: 82vh;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }

        .source-modal-header {
            padding: 12px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-modal-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .source-modal-title {
            font-size: 14.5px;
            font-weight: 800;
            color: #0f172a;
        }

        .save-status-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            background: #e2e8f0;
            color: #64748b;
            transition: all 0.2s;
        }

        .save-status-badge.saved {
            background: #dcfce7;
            color: #166534;
        }

        .save-status-badge.editing {
            background: #fef3c7;
            color: #92400e;
        }

        .source-textarea {
            flex: 1;
            width: 100%;
            border: none;
            padding: 16px;
            box-sizing: border-box;
            font-family: Consolas, Monaco, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #0f172a;
            background: #ffffff;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
        }

        .btn-modal-action {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            transition: all 0.15s;
        }

        .btn-modal-action:hover {
            background: #f1f5f9;
        }

        .btn-modal-primary {
            background: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
        }

        .btn-modal-primary:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <iframe id="render-frame" sandbox="allow-scripts allow-modals allow-same-origin allow-forms allow-popups"></iframe>

    <div class="viewer-floating-bar" id="floating-toolbar">
        <div class="drag-handle" id="drag-handle" title="마우스로 끌어서 원하는 위치로 이동">⠿</div>
        <button class="viewer-btn" onclick="toggleSourceModal()">✏️ HTML 소스 편집</button>
        <button class="viewer-btn" id="btn-quick-copy" onclick="copySourceCode()">📋 코드 복사</button>
        <button class="viewer-btn" onclick="resetToOriginal()" title="사용자 편집 내용을 지우고 뷰티파이어 원본 코드로 되돌립니다.">↩️ 원본 복원</button>
    </div>

    <div class="source-modal-overlay" id="source-modal" onclick="closeModalOnBackdrop(event)">
        <div class="source-modal-card">
            <div class="source-modal-header">
                <div class="source-modal-title-box">
                    <span class="source-modal-title">HTML 소스코드 편집</span>
                    <span class="save-status-badge" id="save-status-badge">동기화됨</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-modal-action btn-modal-primary" id="btn-modal-copy" onclick="copySourceCode()">전체 복사</button>
                    <button class="btn-modal-action" onclick="toggleSourceModal()">닫기 (Esc)</button>
                </div>
            </div>
            <textarea id="source-view-area" class="source-textarea" spellcheck="false" placeholder="HTML 코드를 입력하면 실시간으로 반영됩니다..."></textarea>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'dwk_preview_html';
        const USER_EDIT_KEY = 'dwk_user_edited_html';
        let currentHtmlCode = '';
        let saveDebounceTimer = null;

        // 1. 스토리지 안전 읽기 (사용자가 직접 수정한 코드가 있으면 최우선 로드)
        function getStoredCode() {
            try {
                const edited = localStorage.getItem(USER_EDIT_KEY) || sessionStorage.getItem(USER_EDIT_KEY);
                if (edited && edited.trim().length > 0) return edited;
            } catch (e) {}

            try {
                const local = localStorage.getItem(STORAGE_KEY);
                if (local && local.trim().length > 0) return local;
            } catch (e) {}

            try {
                const session = sessionStorage.getItem(STORAGE_KEY);
                if (session && session.trim().length > 0) return session;
            } catch (e) {}

            return '';
        }

        // 2. 스토리지 강제 양방향 동시 쓰기 (사용자 편집 전용 키에도 영구 동기화)
        function persistCode(code) {
            if (!code || !code.trim()) return;
            try { 
                localStorage.setItem(STORAGE_KEY, code); 
                localStorage.setItem(USER_EDIT_KEY, code);
            } catch (e) {}
            try { 
                sessionStorage.setItem(STORAGE_KEY, code); 
                sessionStorage.setItem(USER_EDIT_KEY, code);
            } catch (e) {}
        }

        // 3. 화면에 HTML 코드 즉각 주입
        function renderToFrame(code) {
            const frame = document.getElementById('render-frame');
            if (!frame) return;

            const fallback = '<div style="padding:40px; text-align:center; color:#64748b; font-family:sans-serif; line-height:1.6;">' +
                             '<h3>렌더링할 HTML 데이터가 없습니다.</h3>' +
                             '<p>원본 뷰티파이어 화면에서 [⛶ 전체화면]을 다시 눌러 실행해주세요.</p></div>';

            frame.srcdoc = (code && code.trim().length > 0) ? code : fallback;
        }

        function loadCode() {
            currentHtmlCode = getStoredCode();
            renderToFrame(currentHtmlCode);
        }

        // 4. ↩️ 사용자 편집 내역을 삭제하고 뷰티파이어 원본 코드로 되돌리는 함수
        function resetToOriginal() {
            const hasUserEdit = localStorage.getItem(USER_EDIT_KEY) || sessionStorage.getItem(USER_EDIT_KEY);
            
            if (!hasUserEdit) {
                alert('현재 이미 원본 코드 상태입니다.');
                return;
            }

            if (confirm('수정한 작업 내용을 모두 취소하고 최초 원본 코드로 되돌리시겠습니까?')) {
                try { localStorage.removeItem(USER_EDIT_KEY); } catch (e) {}
                try { sessionStorage.removeItem(USER_EDIT_KEY); } catch (e) {}

                loadCode();

                const area = document.getElementById('source-view-area');
                if (area) area.value = currentHtmlCode;

                const badge = document.getElementById('save-status-badge');
                if (badge) {
                    badge.innerText = '원본 복원됨';
                    badge.className = 'save-status-badge saved';
                }
            }
        }

        function toggleSourceModal() {
            const modal = document.getElementById('source-modal');
            const isActive = modal.classList.toggle('active');
            
            if (isActive) {
                const area = document.getElementById('source-view-area');
                area.value = currentHtmlCode;
                area.setSelectionRange(0, 0);
                area.scrollTop = 0;
                area.scrollLeft = 0;
                setTimeout(() => area.focus(), 50);
            }
        }

        function closeModalOnBackdrop(e) {
            if (e.target.id === 'source-modal') {
                toggleSourceModal();
            }
        }

        function copySourceCode() {
            if (!currentHtmlCode) return;
            navigator.clipboard.writeText(currentHtmlCode).then(() => {
                const copyBtn = document.getElementById('btn-quick-copy');
                const modalBtn = document.getElementById('btn-modal-copy');
                if (copyBtn) copyBtn.innerText = '✅ 복사 완료!';
                if (modalBtn) modalBtn.innerText = '✅ 복사 완료!';
                setTimeout(() => {
                    if (copyBtn) copyBtn.innerText = '📋 코드 복사';
                    if (modalBtn) modalBtn.innerText = '전체 복사';
                }, 1500);
            });
        }

        // 5. 모달 편집 시 100% 즉시 실시간 화면 반영 & 자동 저장 엔진
        function setupLiveEditor() {
            const area = document.getElementById('source-view-area');
            const badge = document.getElementById('save-status-badge');
            if (!area) return;

            const applyChanges = () => {
                const val = area.value;
                if (!val || !val.trim()) return;

                currentHtmlCode = val;
                persistCode(currentHtmlCode);
                renderToFrame(currentHtmlCode);

                if (badge) {
                    badge.innerText = '자동 저장됨 (F5 유지)';
                    badge.className = 'save-status-badge saved';
                }
            };

            // 타이핑할 때마다 0.15초 내로 즉시 화면 및 스토리지 동기화
            area.addEventListener('input', () => {
                if (badge) {
                    badge.innerText = '반영 중...';
                    badge.className = 'save-status-badge editing';
                }
                clearTimeout(saveDebounceTimer);
                saveDebounceTimer = setTimeout(applyChanges, 150);
            });

            // Tab 키 입력 시 포커스 이동 대신 4칸 들여쓰기 공백 삽입
            area.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = area.selectionStart;
                    const end = area.selectionEnd;
                    area.value = area.value.substring(0, start) + '    ' + area.value.substring(end);
                    area.selectionStart = area.selectionEnd = start + 4;
                    applyChanges();
                }
            });

            // 포커스를 잃거나 닫을 때 즉시 반영
            area.addEventListener('change', applyChanges);

            // 새로고침이나 창 닫기 직전 강제 플러시 저장
            window.addEventListener('beforeunload', () => {
                const codeToSave = (area && area.value && area.value.trim().length > 0) ? area.value : currentHtmlCode;
                persistCode(codeToSave);
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('source-modal');
                if (modal && modal.classList.contains('active')) {
                    modal.classList.remove('active');
                }
            }
        });

        // 플로팅 툴바 드래그 이동 엔진
        (function enableDragging() {
            const toolbar = document.getElementById('floating-toolbar');
            const handle = document.getElementById('drag-handle');
            if (!toolbar || !handle) return;

            let isDragging = false;
            let startX, startY;
            let initialLeft, initialTop;

            function onPointerDown(e) {
                isDragging = true;
                toolbar.classList.add('dragging');
                document.body.classList.add('is-dragging-toolbar');

                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                startX = clientX;
                startY = clientY;

                const rect = toolbar.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;

                toolbar.style.right = 'auto';
                toolbar.style.bottom = 'auto';
                toolbar.style.left = `${initialLeft}px`;
                toolbar.style.top = `${initialTop}px`;

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                e.preventDefault();

                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                let newLeft = initialLeft + deltaX;
                let newTop = initialTop + deltaY;

                const maxLeft = window.innerWidth - toolbar.offsetWidth - 8;
                const maxTop = window.innerHeight - toolbar.offsetHeight - 8;

                newLeft = Math.max(8, Math.min(newLeft, maxLeft));
                newTop = Math.max(8, Math.min(newTop, maxTop));

                toolbar.style.left = `${newLeft}px`;
                toolbar.style.top = `${newTop}px`;
            }

            function onPointerUp() {
                if (!isDragging) return;
                isDragging = false;
                toolbar.classList.remove('dragging');
                document.body.classList.remove('is-dragging-toolbar');

                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
            }

            handle.addEventListener('pointerdown', onPointerDown);
        })();

        window.addEventListener('DOMContentLoaded', () => {
            loadCode();
            setupLiveEditor();
        });
    </script>
</body>
</html>
