<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 뷰어 미리보기 | DevWorKit</title>
    <style>
        /* 뷰어 기본 레이아웃 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #render-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 우측 상단 플로팅 컨트롤 바 */
        .viewer-floating-bar {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 2147483647;
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 10px;
            border-radius: 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .viewer-btn {
            background: transparent;
            border: none;
            color: #f8fafc;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }

        .viewer-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #38bdf8;
        }

        /* 소스코드 모달 오버레이 */
        .source-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2147483647;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .source-modal-overlay.active {
            display: flex;
        }

        .source-modal-card {
            background: #ffffff;
            width: 900px;
            max-width: 100%;
            height: 80vh;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }

        .source-modal-header {
            padding: 14px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
        }

        .source-textarea {
            flex: 1;
            width: 100%;
            border: none;
            padding: 16px;
            box-sizing: border-box;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #0f172a;
            background: #ffffff;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
        }

        .btn-modal-action {
            padding: 6px 14px;
            font-size: 12.5px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            transition: all 0.15s;
        }

        .btn-modal-action:hover {
            background: #f1f5f9;
        }

        .btn-modal-primary {
            background: #7c3aed;
            color: #ffffff;
            border-color: #7c3aed;
        }

        .btn-modal-primary:hover {
            background: #6d28d9;
        }
    </style>
</head>
<body>

    <!-- 1. 실제 사용자 웹 화면 렌더링 프레임 -->
    <iframe id="render-frame" sandbox="allow-scripts allow-modals allow-same-origin allow-forms"></iframe>

    <!-- 2. 플로팅 툴바 -->
    <div class="viewer-floating-bar">
        <button class="viewer-btn" onclick="toggleSourceModal()">📄 HTML 소스 보기</button>
        <button class="viewer-btn" onclick="copySourceCode()">📋 코드 복사</button>
        <button class="viewer-btn" onclick="reloadPreview()" title="화면 새로고침">🔄 새로고침</button>
    </div>

    <!-- 3. 소스코드 모달창 -->
    <div class="source-modal-overlay" id="source-modal" onclick="closeModalOnBackdrop(event)">
        <div class="source-modal-card">
            <div class="source-modal-header">
                <span class="source-modal-title">HTML 소스코드 확인</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-modal-action btn-modal-primary" onclick="copySourceCode()">전체 복사</button>
                    <button class="btn-modal-action" onclick="toggleSourceModal()">닫기</button>
                </div>
            </div>
            <textarea id="source-view-area" class="source-textarea" readonly spellcheck="false"></textarea>
        </div>
    </div>

    <script>
        let currentHtmlCode = '';

        function loadCode() {
            currentHtmlCode = localStorage.getItem('dwk_preview_html') || '<div style="padding:40px; text-align:center; color:#64748b; font-family:sans-serif;">렌더링할 HTML 데이터가 없습니다. 코드 뷰티파이어에서 코드를 입력 후 실행해 주세요.</div>';
            
            const frame = document.getElementById('render-frame');
            frame.srcdoc = currentHtmlCode;

            document.getElementById('source-view-area').value = currentHtmlCode;
        }

        function reloadPreview() {
            loadCode();
        }

        function toggleSourceModal() {
            const modal = document.getElementById('source-modal');
            modal.classList.toggle('active');
            if (modal.classList.contains('active')) {
                document.getElementById('source-view-area').focus();
                document.getElementById('source-view-area').select();
            }
        }

        function closeModalOnBackdrop(e) {
            if (e.target.id === 'source-modal') {
                toggleSourceModal();
            }
        }

        function copySourceCode() {
            if (!currentHtmlCode) return;
            navigator.clipboard.writeText(currentHtmlCode).then(() => {
                alert('HTML 소스코드가 클립보드에 복사되었습니다!');
            });
        }

        window.addEventListener('DOMContentLoaded', loadCode);
    </script>
</body>
</html>
